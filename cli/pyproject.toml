[project]
name = "rustore-dl"
version = "0.3.1"
description = "Download Android APKs from RuStore without the store app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "krolchonok" }]
keywords = ["rustore", "android", "apk", "downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/krolchonok/rustore-dl"
Repository = "https://github.com/krolchonok/rustore-dl"
Issues = "https://github.com/krolchonok/rustore-dl/issues"

[project.scripts]
rustore-dl = "rustore_dl.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rustore_dl*"]
